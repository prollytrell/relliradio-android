# Builds the RelliReels Android app (phone + Android TV) whenever its code changes.
# The APK lands in a "reels-N" release.
name: Build RelliReels APK

on:
  push:
    branches: [main]
    paths: ["reels/**", "gradle/**", "settings.gradle.kts", "build.gradle.kts", ".github/workflows/reels.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELLI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/relli.jks"
            echo "RELLI_KEYSTORE=$RUNNER_TEMP/relli.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          RELLI_KEYSTORE_PASSWORD: ${{ secrets.RELLI_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :reels:assembleRelease
          cp reels/build/outputs/apk/release/reels-release.apk RelliReels.apk

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          {
            echo "Install RelliReels.apk below on your phone and TV."
            echo
            echo "Signing certificate:"
            echo '```'
            "$APKSIGNER" verify --print-certs RelliReels.apk | grep -E "DN|SHA-256"
            echo '```'
          } > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: RelliReels-${{ github.run_number }}
          path: RelliReels.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reels-${{ github.run_number }}
          name: RelliReels build ${{ github.run_number }}
          files: RelliReels.apk
          body_path: notes.md
